; Krebb One - ESP32-S3 firmware
;
; Krebb One is a research prototype. It is not a medical device, calorimeter,
; or validated calorie tracker. See README.md.
;
; Board: Espressif ESP32-S3-DevKitC-1 (ESP32-S3-WROOM-1-N8R8).
; The N8R8 module has 8 MB octal PSRAM, but this firmware does NOT use PSRAM:
; the sensor/BLE workload fits in internal SRAM, and leaving PSRAM disabled
; keeps GPIO35-37 (octal PSRAM data lines) out of play entirely.

[platformio]
default_envs = esp32s3

; ---------------------------------------------------------------- target board
[env:esp32s3]
platform = espressif32@6.9.0          ; Arduino-ESP32 core 2.0.17 / ESP-IDF 4.4.7
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = time, colorize, esp32_exception_decoder
extra_scripts = pre:scripts/inject_build_epoch.py

; Exact versions are pinned so a rebuild on demo day cannot pull a new major.
lib_deps =
    paulstoffregen/OneWire@2.3.8
    milesburton/DallasTemperature@3.11.0
    beegee-tokyo/DHT sensor library for ESPx@1.19.0
    h2zero/NimBLE-Arduino@1.4.2       ; 1.4.x API; 2.x renamed callbacks/types

build_flags =
    -Wall
    -Wextra
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1              ; ESP_LOGE/W only; our own logs go to Serial
    ; Serial goes to UART0 -> the USB-to-UART bridge -> the port labelled UART.
    ; ARDUINO_USB_CDC_ON_BOOT is deliberately NOT set (see the block below).

build_unflags = -std=gnu++11

; The device build has no on-target unit tests; the pure logic is covered by
; `pio test -e native`, which runs far faster and needs no hardware.
test_ignore = *

; --- ALTERNATIVE: flashing/monitoring through the native USB port -------------
; Uncomment this env and use `-e esp32s3_usbcdc` if you move the cable to the
; port labelled USB (the ESP32-S3's own USB peripheral, GPIO19/20) instead of
; the port labelled UART. Serial then becomes USB CDC, the port name changes
; (/dev/cu.usbmodem*), and the port disappears while the chip reboots.
;
; [env:esp32s3_usbcdc]
; extends = env:esp32s3
; build_flags =
;     ${env:esp32s3.build_flags}
;     -DARDUINO_USB_CDC_ON_BOOT=1
;     -DARDUINO_USB_MODE=1

; ------------------------------------------------- host-side unit tests (fast)
; `pio test -e native` builds ONLY lib/krebb_core (pure C++, no Arduino headers)
; plus the Unity suites in test/test_native.
[env:native]
platform = native
test_framework = unity
test_filter = test_native
build_src_filter = -<*>               ; src/ is Arduino-only; never built here
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -I lib/krebb_core/src
    -I include                        ; pins.h is plain constants, host-safe
    -DBUILD_UNIX_EPOCH_S=1760000000   ; fixed value so host tests are hermetic
    -DKREBB_HOST_BUILD=1
